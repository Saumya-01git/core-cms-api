<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Core CMS — Headless Portfolio Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Locally Vendored Libraries (Instant local loading, zero CDN/network failure) -->
  <script src="/admin/vendor/tailwind.js"></script>
  <script src="/admin/vendor/react.min.js"></script>
  <script src="/admin/vendor/react-dom.min.js"></script>
  <script src="/admin/vendor/babel.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            heading: ['"Outfit"', 'sans-serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            palette: {
              mauve: '#C2AFF0',
              periwinkle: '#9191E9',
              steel: '#457EAC',
              baltic: '#2D5D7B',
              grey: '#686868'
            }
          }
        }
      }
    }
  </script>
  <style>
    html {
      font-size: 16px;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #172735;
      color: #f1f5f9;
      letter-spacing: -0.01em;
    }
    h1, h2 {
      font-family: 'Outfit', sans-serif;
      letter-spacing: -0.025em;
    }

    /* Aurora Canvas Background with Baltic Blue & Periwinkle/Mauve Gradients */
    .aurora-bg {
      background: 
        radial-gradient(ellipse 90% 65% at 50% -20%, rgba(69, 126, 172, 0.4), transparent 70%),
        radial-gradient(circle 750px at 85% 25%, rgba(194, 175, 240, 0.28), transparent 70%),
        radial-gradient(circle 650px at 15% 65%, rgba(145, 145, 233, 0.28), transparent 70%),
        radial-gradient(circle 850px at 70% 90%, rgba(45, 93, 123, 0.42), transparent 70%),
        #172735;
    }

    /* Frosted Glass Panels */
    .glass-panel {
      background: rgba(28, 48, 65, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(194, 175, 240, 0.22);
    }

    .glass-card {
      background: rgba(34, 57, 76, 0.58);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(145, 145, 233, 0.2);
    }

    .glass-card:hover {
      border-color: rgba(194, 175, 240, 0.6);
      box-shadow: 0 16px 40px -10px rgba(45, 93, 123, 0.45), 0 0 25px -5px rgba(145, 145, 233, 0.25);
    }

    /* Radiant Text Gradients matching the portfolio */
    .text-gradient-aurora {
      background: linear-gradient(135deg, #ffffff 0%, #C2AFF0 40%, #9191E9 75%, #457EAC 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .text-gradient-cyan {
      background: linear-gradient(135deg, #ffffff 0%, #38bdf8 45%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Custom Scrollbar in Palette Colors */
    .custom-scrollbar::-webkit-scrollbar,
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-track,
    ::-webkit-scrollbar-track {
      background: #172735;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb,
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(to bottom, #9191E9, #457EAC, #2D5D7B);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover,
    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(to bottom, #C2AFF0, #9191E9, #457EAC);
    }

    /* Moving Fluid Cyber Gradients */
    @keyframes adminAurora1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(60px, 45px) scale(1.12); }
    }
    @keyframes adminAurora2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-50px, -35px) scale(1.15); }
    }
    @keyframes adminAurora3 {
      0%, 100% { transform: translate(45px, -50px) scale(1.08); }
      50% { transform: translate(-30px, 40px) scale(1); }
    }
    .animate-admin-aurora-1 { animation: adminAurora1 20s ease-in-out infinite; }
    .animate-admin-aurora-2 { animation: adminAurora2 25s ease-in-out infinite; }
    .animate-admin-aurora-3 { animation: adminAurora3 22s ease-in-out infinite; }

    /* Technical Perspective Grid Overlay */
    .admin-cyber-grid {
      background-image: 
        linear-gradient(to right, rgba(145, 145, 233, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(69, 126, 172, 0.06) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at 50% 50%, black 50%, transparent 92%);
      -webkit-mask-image: radial-gradient(circle at 50% 50%, black 50%, transparent 92%);
    }

    /* Cyber Scanline */
    @keyframes adminScanline {
      0% { transform: translateY(-100%); opacity: 0; }
      15% { opacity: 0.6; }
      85% { opacity: 0.6; }
      100% { transform: translateY(100vh); opacity: 0; }
    }
    .admin-scanline {
      height: 140px;
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(194, 175, 240, 0.03) 40%,
        rgba(145, 145, 233, 0.07) 75%,
        rgba(69, 126, 172, 0.12) 98%,
        rgba(194, 175, 240, 0.22) 100%
      );
      animation: adminScanline 14s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      pointer-events: none;
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 antialiased selection:bg-[#9191E9] selection:text-white aurora-bg">
  <div id="root">
    <div class="min-h-screen flex flex-col items-center justify-center aurora-bg text-slate-300">
      <div class="w-14 h-14 border-4 border-[#C2AFF0] border-t-transparent rounded-full animate-spin mb-4"></div>
      <p class="font-heading text-lg font-bold tracking-wide text-white">Starting Core CMS Admin Interface...</p>
    </div>
  </div>
  <script type="text/babel" src="/admin/app.jsx"></script>
</body>
</html>
