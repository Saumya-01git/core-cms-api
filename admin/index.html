<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Core CMS — Headless Portfolio Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Locally Vendored Libraries (Instant local loading, zero CDN/network failure) -->
  <script src="/admin/vendor/tailwind.js"></script>
  <script src="/admin/vendor/react.min.js"></script>
  <script src="/admin/vendor/react-dom.min.js"></script>
  <script src="/admin/vendor/babel.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            },
            dark: {
              950: '#090d16',
              900: '#0f172a',
              850: '#141e33',
              800: '#1e293b',
              700: '#334155',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #090d16;
      color: #f1f5f9;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Moving Fluid Cyber Gradients */
    @keyframes adminAurora1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(50px, 40px) scale(1.12); }
    }
    @keyframes adminAurora2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-40px, -30px) scale(1.15); }
    }
    @keyframes adminAurora3 {
      0%, 100% { transform: translate(30px, -40px) scale(1.08); }
      50% { transform: translate(-30px, 30px) scale(1); }
    }
    .animate-admin-aurora-1 { animation: adminAurora1 20s ease-in-out infinite; }
    .animate-admin-aurora-2 { animation: adminAurora2 25s ease-in-out infinite; }
    .animate-admin-aurora-3 { animation: adminAurora3 22s ease-in-out infinite; }

    /* Technical Perspective Grid Overlay */
    .admin-cyber-grid {
      background-image: 
        linear-gradient(to right, rgba(56, 189, 248, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(192, 132, 252, 0.05) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(circle at 50% 50%, black 60%, transparent 95%);
      -webkit-mask-image: radial-gradient(circle at 50% 50%, black 60%, transparent 95%);
    }

    /* Cyber Scanline */
    @keyframes adminScanline {
      0% { transform: translateY(-100%); opacity: 0; }
      15% { opacity: 0.6; }
      85% { opacity: 0.6; }
      100% { transform: translateY(100vh); opacity: 0; }
    }
    .admin-scanline {
      height: 120px;
      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(56, 189, 248, 0.03) 40%,
        rgba(192, 132, 252, 0.08) 75%,
        rgba(52, 211, 153, 0.12) 98%,
        rgba(56, 189, 248, 0.22) 100%
      );
      animation: adminScanline 14s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      pointer-events: none;
    }
  </style>
</head>
<body class="min-h-screen text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root">
    <div class="min-h-screen flex flex-col items-center justify-center bg-[#090d16] text-slate-300">
      <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
      <p class="font-mono text-sm tracking-wide text-indigo-300">Starting Core CMS Admin Interface...</p>
    </div>
  </div>
  <script type="text/babel" src="/admin/app.jsx"></script>
</body>
</html>
