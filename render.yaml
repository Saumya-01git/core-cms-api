services:
  - type: web
    name: core-cms-api
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma db push --skip-generate && node prisma/seed.js
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: core-cms-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: UPLOAD_DIR
        value: "./uploads"

databases:
  - name: core-cms-db
    plan: free
    region: oregon
    databaseName: core_cms_db
    user: postgres
